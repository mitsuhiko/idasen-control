[package]
name = "desk"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
btleplug = "0.11"
clap = { version = "4.5", features = ["derive"] }
dialoguer = "0.11"
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
uuid = "1.10"
